[project]
name = "dismanager"
version = "1.0.1"
description = "Manage processes and stream their consoles through Discord."
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Mauricio", email = "150753762+mjpr-3435@users.noreply.github.com" },
]
keywords = ["discord", "process-manager", "console", "bot", "server-manager"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
requires-python = ">=3.13"

dependencies = [
    "discord-py>=2.7.1",
    "psutil>=7.2.2",
    "ruamel-yaml>=0.19.1",
]

[project.urls]
Homepage = "https://github.com/mjpr-3435/DisManager"
Repository = "https://github.com/mjpr-3435/DisManager"
Issues = "https://github.com/mjpr-3435/DisManager/issues"
Documentation = "https://github.com/mjpr-3435/DisManager/blob/main/docs/GUIDE.md"

[project.scripts]
dismanager = "dismanager.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pyright>=1.1.410",
    "ruff>=0.15.8",
    "types-psutil>=7.2.2.20260408",
]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dismanager*"]

[tool.setuptools.package-data]
dismanager = ["locales/**/*.mo", "templates/*", "py.typed"]
