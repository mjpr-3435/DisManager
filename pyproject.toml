[project]
name = "dismanager"
version = "0.1.0"
description = "Manage processes and stream their consoles through Discord."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "discord-py>=2.7.1",
    "psutil>=7.2.2",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
dismanager = "dismanager.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pyright>=1.1.410",
    "ruff>=0.15.8",
    "types-psutil>=7.2.2.20260408",
]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
dismanager = ["locales/**/*.mo", "templates/*", "py.typed"]
